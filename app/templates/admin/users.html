{% extends "base.html" %}
{% block title %}مدیریت کاربران{% endblock %}
{% block content %}
<h1 class="page-title">کاربران</h1>
<div class="card-block" style="padding:0; overflow-x:auto;">
    <table class="table-clean" style="margin:0; min-width:600px;">
        <thead><tr><th style="padding-right:18px;">شناسه</th><th>نام کاربری</th><th>ایمیل</th><th>نقش</th><th>هش رمز عبور</th></tr></thead>
        <tbody>
        {% for u in users %}
            <tr>
                <td style="padding-right:18px;">{{ u['id']|fanum }}</td>
                <td>{{ u['username'] }}</td>
                <td>{{ u['email'] }}</td>
                <td>{{ u['role'] }}</td>
                <td><code style="direction:ltr; display:inline-block;">{{ u['password_hash'] }}</code></td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
