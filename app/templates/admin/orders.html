{% extends "base.html" %}
{% block title %}Admin - Orders{% endblock %}
{% block content %}
<h1>All Orders</h1>
<table class="table">
    <thead><tr><th>ID</th><th>User</th><th>Total</th><th>Status</th><th>Created</th></tr></thead>
    <tbody>
    {% for o in orders %}
        <tr>
            <td><a href="{{ url_for('account.order_detail', order_id=o['id']) }}">{{ o['id'] }}</a></td>
            <td>{{ o['username'] }}</td>
            <td>${{ "%.2f"|format(o['total']) }}</td>
            <td>{{ o['status'] }}</td>
            <td>{{ o['created_at'] }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
