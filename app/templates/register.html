{% extends "base.html" %}
{% block title %}ثبت‌نام - نوری‌شاپ{% endblock %}
{% block content %}
<div class="form-page">
    <h1>ساخت حساب کاربری</h1>
    <form method="post">
        <div class="field">
            <label>نام کاربری</label>
            <input type="text" name="username">
        </div>
        <div class="field">
            <label>ایمیل</label>
            <input type="email" name="email">
        </div>
        <div class="field">
            <label>رمز عبور</label>
            <input type="password" name="password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">ثبت‌نام</button>
    </form>
    <div class="form-links">
        قبلا ثبت‌نام کرده‌اید؟ <a href="{{ url_for('auth.login') }}">وارد شوید</a>
    </div>
</div>
{% endblock %}
