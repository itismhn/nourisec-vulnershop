{% extends "base.html" %}
{% block title %}{{ t('auth.register_title') }} - {{ t('site.name') }}{% endblock %}
{% block content %}
<div class="form-page">
    <h1>{{ t('auth.register_title') }}</h1>
    <form method="post">
        <div class="field">
            <label>{{ t('auth.username_label') }}</label>
            <input type="text" name="username">
        </div>
        <div class="field">
            <label>{{ t('auth.email_label') }}</label>
            <input type="email" name="email">
        </div>
        <div class="field">
            <label>{{ t('auth.password_label') }}</label>
            <input type="password" name="password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">{{ t('auth.register_btn') }}</button>
    </form>
    <div class="form-links">
        {{ t('auth.already_registered') }} <a href="{{ url_for('auth.login') }}">{{ t('auth.login_link') }}</a>
    </div>
</div>
{% endblock %}
