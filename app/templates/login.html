{% extends "base.html" %}
{% block title %}{{ t('auth.login_title') }} - {{ t('site.name') }}{% endblock %}
{% block content %}
<div class="form-page">
    <h1>{{ t('auth.login_title') }}</h1>
    <form method="post">
        <div class="field">
            <label>{{ t('auth.username_label') }}</label>
            <input type="text" name="username" autocomplete="off">
        </div>
        <div class="field">
            <label>{{ t('auth.password_label') }}</label>
            <input type="password" name="password" autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary btn-block">{{ t('auth.login_btn') }}</button>
    </form>
    <div class="form-links">
        <a href="{{ url_for('auth.forgot_password') }}">{{ t('auth.forgot_password_link') }}</a><br>
        {{ t('auth.no_account') }} <a href="{{ url_for('auth.register') }}">{{ t('auth.register_link') }}</a>
    </div>
</div>
{% endblock %}
