{% extends "base.html" %}
{% block title %}ورود - نوری‌شاپ{% endblock %}
{% block content %}
<div class="form-page">
    <h1>ورود به حساب کاربری</h1>
    <form method="post">
        <div class="field">
            <label>نام کاربری</label>
            <input type="text" name="username" autocomplete="off">
        </div>
        <div class="field">
            <label>رمز عبور</label>
            <input type="password" name="password" autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary btn-block">ورود</button>
    </form>
    <div class="form-links">
        <a href="{{ url_for('auth.forgot_password') }}">رمز عبور را فراموش کرده‌اید؟</a><br>
        حساب کاربری ندارید؟ <a href="{{ url_for('auth.register') }}">ثبت‌نام کنید</a>
    </div>
</div>
{% endblock %}
