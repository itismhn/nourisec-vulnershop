{% extends "base.html" %}
{% block title %}{{ t('auth.reset_title') }} - {{ t('site.name') }}{% endblock %}
{% block content %}
<div class="form-page">
    <h1>{{ t('auth.reset_title') }}</h1>
    <form method="post">
{{ csrf_input() }}
        <div class="field">
            <label>{{ t('auth.new_password_label') }}</label>
            <input type="password" name="password"{% if AUTH_SECURE %} autocomplete="new-password" minlength="10" maxlength="128" required{% endif %}>
            {% if AUTH_SECURE %}<small>{{ t('auth.password_hint') }}</small>{% endif %}
        </div>
        <button type="submit" class="btn btn-primary btn-block">{{ t('auth.update_password_btn') }}</button>
    </form>
</div>
{% endblock %}
