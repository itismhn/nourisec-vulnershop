{% extends "base.html" %}
{% block title %}Checkout - NouriSec VulnerShop{% endblock %}
{% block content %}
<h1>Checkout</h1>
<div class="alert alert-info">This is a fake checkout for training purposes. No real payment is processed - do not enter real card details.</div>
<form method="post">
    <div class="mb-3">
        <label class="form-label">Card Number (fake)</label>
        <input type="text" class="form-control" placeholder="4111 1111 1111 1111" pattern="[0-9 ]*">
    </div>
    <div class="row">
        <div class="col mb-3">
            <label class="form-label">Expiry (fake)</label>
            <input type="text" class="form-control" placeholder="12/34">
        </div>
        <div class="col mb-3">
            <label class="form-label">CVV (fake)</label>
            <input type="text" class="form-control" placeholder="123">
        </div>
    </div>
    <button type="submit" class="btn btn-success">Place Fake Order</button>
</form>
{% endblock %}
