{% extends "base.html" %}
{% block title %}پرداخت - نوری‌شاپ{% endblock %}
{% block content %}
<h1 class="page-title">تسویه حساب</h1>
<div class="alert alert-info" style="max-width:480px;">این یک پرداخت آزمایشی برای اهداف آموزشی است. هیچ مبلغ واقعی کسر نمی‌شود - لطفا اطلاعات کارت واقعی وارد نکنید.</div>

<form method="post" class="form-page" style="margin:20px 0;">
    <div class="field">
        <label>شماره کارت (آزمایشی)</label>
        <input type="text" placeholder="۱۲۳۴ ۵۶۷۸ ۹۰۱۲ ۳۴۵۶">
    </div>
    <div style="display:flex; gap:12px;">
        <div class="field" style="flex:1;">
            <label>تاریخ انقضا (آزمایشی)</label>
            <input type="text" placeholder="۰۴/۰۶">
        </div>
        <div class="field" style="flex:1;">
            <label>CVV2 (آزمایشی)</label>
            <input type="text" placeholder="۱۲۳">
        </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block">ثبت سفارش آزمایشی</button>
</form>
{% endblock %}
