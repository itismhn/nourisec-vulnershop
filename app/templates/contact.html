{% extends "base.html" %}
{% block title %}تماس با ما - نوری‌شاپ{% endblock %}
{% block content %}
<div class="form-page">
    <h1>تماس با ما</h1>
    <form method="post">
        <div class="field">
            <label>نام</label>
            <input type="text" name="name">
        </div>
        <div class="field">
            <label>ایمیل</label>
            <input type="email" name="email">
        </div>
        <div class="field">
            <label>پیام</label>
            <textarea name="message" rows="4"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">ارسال پیام</button>
    </form>
</div>
{% endblock %}
