{% extends "base.html" %}
{% block title %}{{ t('contact.title') }} - {{ t('site.name') }}{% endblock %}
{% block content %}
<div class="form-page">
    <h1>{{ t('contact.title') }}</h1>
    <form method="post">
        <div class="field">
            <label>{{ t('contact.name_label') }}</label>
            <input type="text" name="name">
        </div>
        <div class="field">
            <label>{{ t('auth.email_label') }}</label>
            <input type="email" name="email">
        </div>
        <div class="field">
            <label>{{ t('contact.message_label') }}</label>
            <textarea name="message" rows="4"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">{{ t('contact.send_btn') }}</button>
    </form>
</div>
{% endblock %}
